<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat & Play - Timed Challenges</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .game-card:hover { transform: translateY(-4px); transition: all 0.2s; }
    .timer { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 min-h-screen text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // 10 Games definitions
    const GAMES = [
      { id: 'math', name: 'Math Sprint', icon: '🧮', desc: 'Solve as many math problems as possible', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'memory', name: 'Memory Match', icon: '🧠', desc: 'Flip cards and match pairs', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'reaction', name: 'Reaction Time', icon: '⚡', desc: 'Click as fast as you can when color changes', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'scramble', name: 'Word Scramble', icon: '🔤', desc: 'Unscramble the words', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'sequence', name: 'Number Sequence', icon: '🔢', desc: 'Find the next number in sequence', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'typing', name: 'Typing Speed', icon: '⌨️', desc: 'Type the words as fast as possible', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'color', name: 'Color Match', icon: '🎨', desc: 'Match the color name with the display', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'trivia', name: 'Quick Trivia', icon: '❓', desc: 'Answer trivia questions', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'snake', name: 'Snake', icon: '🐍', desc: 'Classic snake game - eat apples', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'puzzle', name: 'Slide Puzzle', icon: '🧩', desc: 'Slide tiles to solve the puzzle', difficulties: ['Easy', 'Medium', 'Hard'] },
    ];

    const TIMES = [1, 2, 5]; // minutes

    function App() {
      const [username, setUsername] = useState(localStorage.getItem('username') || '');
      const [screen, setScreen] = useState(username ? 'home' : 'login');
      const [selectedGame, setSelectedGame] = useState(null);
      const [difficulty, setDifficulty] = useState('Medium');
      const [timeLimit, setTimeLimit] = useState(1);
      const [challengeCode, setChallengeCode] = useState('');
      const [joinCode, setJoinCode] = useState('');
      const [chatMessages, setChatMessages] = useState([
        { user: 'System', text: 'Welcome to Chat & Play! Invite friends to challenge you.', time: new Date().toLocaleTimeString() }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [scores, setScores] = useState(JSON.parse(localStorage.getItem('scores') || '[]'));
      const chatEndRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('username', username);
      }, [username]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);

      const addChat = (user, text) => {
        setChatMessages(prev => [...prev, { user, text, time: new Date().toLocaleTimeString() }]);
      };

      const handleLogin = () => {
        if (username.trim()) setScreen('home');
      };

      const startGame = (game) => {
        setSelectedGame(game);
        setScreen('setup');
      };

      const beginChallenge = () => {
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        setChallengeCode(code);
        addChat('System', `${username} created a challenge: ${selectedGame.name} (${difficulty}, ${timeLimit} min). Code: ${code}`);
        setScreen('playing');
      };

      const joinChallenge = () => {
        if (joinCode.trim().length >= 4) {
          addChat('System', `${username} joined challenge with code ${joinCode.toUpperCase()}`);
          setChallengeCode(joinCode.toUpperCase());
          setScreen('playing');
        }
      };

      const shareWhatsApp = () => {
        const text = `Hey! Challenge me on Chat & Play app!\nGame: ${selectedGame?.name || 'a fun game'}\nDifficulty: ${difficulty}\nTime: ${timeLimit} min\nCode: ${challengeCode || 'XXXXXX'}\n\nOpen the app and join with the code!`;
        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      };

      const saveScore = (score) => {
        const newScore = {
          username,
          game: selectedGame.name,
          difficulty,
          time: timeLimit,
          score,
          date: new Date().toISOString(),
          code: challengeCode
        };
        const updated = [newScore, ...scores].slice(0, 50);
        setScores(updated);
        localStorage.setItem('scores', JSON.stringify(updated));
        addChat('System', `${username} scored ${score} points in ${selectedGame.name}!`);
      };

      if (screen === 'login') {
        return (
          <div className="flex items-center justify-center min-h-screen p-4">
            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 max-w-md w-full border border-white/20 shadow-2xl">
              <h1 className="text-4xl font-bold text-center mb-2">🎮 Chat & Play</h1>
              <p className="text-center text-white/70 mb-8">Timed challenges with friends</p>
              <input
                type="text"
                placeholder="Enter your username"
                value={username}
                onChange={e => setUsername(e.target.value)}
                onKeyPress={e => e.key === 'Enter' && handleLogin()}
                className="w-full px-4 py-3 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-pink-400 mb-4"
              />
              <button
                onClick={handleLogin}
                className="w-full bg-gradient-to-r from-pink-500 to-purple-600 py-3 rounded-xl font-semibold hover:opacity-90 transition"
              >
                Start Playing
              </button>
            </div>
          </div>
        );
      }

      if (screen === 'home') {
        return (
          <div className="min-h-screen p-4 md:p-8">
            <header className="flex justify-between items-center mb-6">
              <div>
                <h1 className="text-3xl font-bold">🎮 Chat & Play</h1>
                <p className="text-white/70">Welcome, {username}!</p>
              </div>
              <button onClick={() => setScreen('scores')} className="bg-white/10 px-4 py-2 rounded-xl hover:bg-white/20">
                <i className="fas fa-trophy mr-2"></i>Scores
              </button>
            </header>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 mb-8">
              {GAMES.map(game => (
                <div key={game.id} onClick={() => startGame(game)} className="game-card bg-white/10 backdrop-blur rounded-2xl p-4 cursor-pointer border border-white/10 hover:border-pink-400">
                  <div className="text-4xl mb-2">{game.icon}</div>
                  <h3 className="font-bold text-lg">{game.name}</h3>
                  <p className="text-sm text-white/60 mt-1">{game.desc}</p>
                </div>
              ))}
            </div>

            <div className="bg-white/10 backdrop-blur rounded-2xl p-4 max-w-md">
              <h3 className="font-bold mb-2"><i className="fas fa-key mr-2"></i>Join a Challenge</h3>
              <div className="flex gap-2">
                <input
                  placeholder="Enter challenge code"
                  value={joinCode}
                  onChange={e => setJoinCode(e.target.value.toUpperCase())}
                  className="flex-1 px-3 py-2 rounded-lg bg-white/20 border border-white/30"
                />
                <button onClick={joinChallenge} className="bg-pink-500 px-4 py-2 rounded-lg font-semibold">Join</button>
              </div>
            </div>

            {/* Chat Panel */}
            <div className="fixed bottom-4 right-4 w-80 bg-black/40 backdrop-blur-xl rounded-2xl border border-white/20 shadow-2xl flex flex-col max-h-96">
              <div className="p-3 border-b border-white/10 font-semibold flex items-center">
                <i className="fas fa-comments mr-2 text-pink-400"></i> Live Chat
              </div>
              <div className="flex-1 overflow-y-auto p-3 space-y-2 text-sm max-h-60">
                {chatMessages.map((m, i) => (
                  <div key={i} className={`${m.user === 'System' ? 'text-yellow-300' : ''}`}>
                    <span className="font-bold text-pink-300">{m.user}:</span> {m.text}
                    <span className="text-xs text-white/40 ml-2">{m.time}</span>
                  </div>
                ))}
                <div ref={chatEndRef} />
              </div>
              <div className="p-2 border-t border-white/10 flex gap-2">
                <input
                  value={chatInput}
                  onChange={e => setChatInput(e.target.value)}
                  onKeyPress={e => {
                    if (e.key === 'Enter' && chatInput.trim()) {
                      addChat(username, chatInput);
                      setChatInput('');
                    }
                  }}
                  placeholder="Type a message..."
                  className="flex-1 px-3 py-2 rounded-lg bg-white/10 text-sm"
                />
                <button onClick={() => { if (chatInput.trim()) { addChat(username, chatInput); setChatInput(''); } }} className="bg-pink-500 px-3 rounded-lg">
                  <i className="fas fa-paper-plane"></i>
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (screen === 'setup') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 max-w-lg w-full border border-white/20">
              <button onClick={() => setScreen('home')} className="text-white/60 mb-4 hover:text-white">← Back</button>
              <div className="text-5xl mb-4 text-center">{selectedGame.icon}</div>
              <h2 className="text-3xl font-bold text-center mb-2">{selectedGame.name}</h2>
              <p className="text-center text-white/70 mb-6">{selectedGame.desc}</p>

              <div className="mb-4">
                <label className="block text-sm mb-2">Difficulty</label>
                <div className="flex gap-2">
                  {selectedGame.difficulties.map(d => (
                    <button key={d} onClick={() => setDifficulty(d)} className={`flex-1 py-2 rounded-xl ${difficulty === d ? 'bg-pink-500' : 'bg-white/10'}`}>
                      {d}
                    </button>
                  ))}
                </div>
              </div>

              <div className="mb-6">
                <label className="block text-sm mb-2">Time Limit</label>
                <div className="flex gap-2">
                  {TIMES.map(t => (
                    <button key={t} onClick={() => setTimeLimit(t)} className={`flex-1 py-2 rounded-xl ${timeLimit === t ? 'bg-purple-500' : 'bg-white/10'}`}>
                      {t} min
                    </button>
                  ))}
                </div>
              </div>

              <button onClick={beginChallenge} className="w-full bg-gradient-to-r from-green-500 to-emerald-600 py-3 rounded-xl font-bold text-lg mb-3">
                Create Challenge & Play
              </button>
              <button onClick={shareWhatsApp} className="w-full bg-green-600/80 py-2 rounded-xl font-semibold flex items-center justify-center gap-2">
                <i className="fab fa-whatsapp"></i> Share on WhatsApp
              </button>
            </div>
          </div>
        );
      }

      if (screen === 'playing') {
        return <GamePlayer 
          game={selectedGame} 
          difficulty={difficulty} 
          timeLimit={timeLimit * 60} 
          username={username}
          challengeCode={challengeCode}
          onFinish={(score) => { saveScore(score); setScreen('result'); }}
          onExit={() => setScreen('home')}
        />;
      }

      if (screen === 'result') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 max-w-md w-full text-center border border-white/20">
              <div className="text-6xl mb-4">🏆</div>
              <h2 className="text-3xl font-bold mb-2">Challenge Complete!</h2>
              <p className="text-xl mb-4">Your score has been saved</p>
              {challengeCode && <p className="bg-white/20 inline-block px-4 py-2 rounded-full mb-4">Code: {challengeCode}</p>}
              <button onClick={shareWhatsApp} className="w-full bg-green-600 py-3 rounded-xl font-semibold mb-3 flex items-center justify-center gap-2">
                <i className="fab fa-whatsapp"></i> Share Result on WhatsApp
              </button>
              <button onClick={() => setScreen('home')} className="w-full bg-white/20 py-3 rounded-xl">Back to Games</button>
            </div>
          </div>
        );
      }

      if (screen === 'scores') {
        return (
          <div className="min-h-screen p-4 md:p-8">
            <button onClick={() => setScreen('home')} className="mb-4 text-white/70">← Back</button>
            <h2 className="text-3xl font-bold mb-6">🏆 Recent Scores</h2>
            <div className="space-y-3 max-w-2xl">
              {scores.length === 0 ? <p className="text-white/60">No scores yet. Play a game!</p> : scores.map((s, i) => (
                <div key={i} className="bg-white/10 rounded-xl p-4 flex justify-between items-center">
                  <div>
                    <div className="font-bold">{s.username} - {s.game}</div>
                    <div className="text-sm text-white/60">{s.difficulty} • {s.time} min • Code: {s.code || '-'}</div>
                  </div>
                  <div className="text-2xl font-bold text-yellow-400">{s.score}</div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return null;
    }

    // Game Player component that renders the actual game
    function GamePlayer({ game, difficulty, timeLimit, username, challengeCode, onFinish, onExit }) {
      const [timeLeft, setTimeLeft] = useState(timeLimit);
      const [score, setScore] = useState(0);
      const [gameOver, setGameOver] = useState(false);
      const timerRef = useRef(null);

      useEffect(() => {
        timerRef.current = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 1) {
              clearInterval(timerRef.current);
              setGameOver(true);
              return 0;
            }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(timerRef.current);
      }, []);

      useEffect(() => {
        if (gameOver) {
          setTimeout(() => onFinish(score), 1500);
        }
      }, [gameOver, score]);

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, '0')}`;
      };

      return (
        <div className="min-h-screen p-4">
          <div className="flex justify-between items-center mb-4 bg-black/30 rounded-2xl p-4">
            <div>
              <h2 className="text-xl font-bold">{game.icon} {game.name}</h2>
              <p className="text-sm text-white/70">{difficulty} • Code: {challengeCode || 'Solo'}</p>
            </div>
            <div className="text-right">
              <div className="text-3xl font-bold timer text-yellow-400">{formatTime(timeLeft)}</div>
              <div className="text-lg">Score: <span className="font-bold text-green-400">{score}</span></div>
            </div>
            <button onClick={onExit} className="bg-red-500/80 px-4 py-2 rounded-xl">Exit</button>
          </div>

          <div className="bg-white/5 rounded-3xl p-4 min-h-[60vh] flex items-center justify-center">
            {gameOver ? (
              <div className="text-center">
                <div className="text-6xl mb-4">⏰</div>
                <h3 className="text-3xl font-bold">Time's Up!</h3>
                <p className="text-xl mt-2">Final Score: {score}</p>
              </div>
            ) : (
              <GameContent 
                gameId={game.id} 
                difficulty={difficulty} 
                score={score} 
                setScore={setScore} 
                timeLeft={timeLeft}
              />
            )}
          </div>
        </div>
      );
    }

    // Individual game implementations
    function GameContent({ gameId, difficulty, score, setScore, timeLeft }) {
      const diffMult = difficulty === 'Easy' ? 1 : difficulty === 'Medium' ? 1.5 : 2;

      if (gameId === 'math') return <MathGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'memory') return <MemoryGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'reaction') return <ReactionGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'scramble') return <ScrambleGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'sequence') return <SequenceGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'typing') return <TypingGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'color') return <ColorGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'trivia') return <TriviaGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'snake') return <SnakeGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'puzzle') return <PuzzleGame difficulty={difficulty} setScore={setScore} />;
      return <div>Game not found</div>;
    }

    // === MATH GAME ===
    function MathGame({ difficulty, setScore }) {
      const [problem, setProblem] = useState(null);
      const [answer, setAnswer] = useState('');
      const [feedback, setFeedback] = useState('');

      const generate = useCallback(() => {
        const ops = difficulty === 'Easy' ? ['+', '-'] : difficulty === 'Medium' ? ['+', '-', '*'] : ['+', '-', '*', '/'];
        const op = ops[Math.floor(Math.random() * ops.length)];
        let a = Math.floor(Math.random() * (difficulty === 'Easy' ? 20 : difficulty === 'Medium' ? 50 : 100)) + 1;
        let b = Math.floor(Math.random() * (difficulty === 'Easy' ? 20 : difficulty === 'Medium' ? 30 : 50)) + 1;
        if (op === '-') { if (a < b) [a, b] = [b, a]; }
        if (op === '/') { a = b * (Math.floor(Math.random() * 10) + 1); }
        let ans = eval(`${a}${op}${b}`);
        setProblem({ text: `${a} ${op} ${b} = ?`, answer: Math.round(ans) });
        setAnswer('');
        setFeedback('');
      }, [difficulty]);

      useEffect(() => { generate(); }, [generate]);

      const submit = () => {
        if (parseInt(answer) === problem.answer) {
          setScore(s => s + (difficulty === 'Easy' ? 10 : difficulty === 'Medium' ? 15 : 20));
          setFeedback('Correct! +points');
          setTimeout(generate, 400);
        } else {
          setFeedback('Wrong!');
          setTimeout(() => setFeedback(''), 800);
        }
      };

      return (
        <div className="text-center w-full max-w-md">
          <div className="text-5xl font-bold mb-6">{problem?.text}</div>
          <input
            type="number"
            value={answer}
            onChange={e => setAnswer(e.target.value)}
            onKeyPress={e => e.key === 'Enter' && submit()}
            className="w-full text-center text-3xl py-4 rounded-2xl bg-white/20 border-2 border-white/30 mb-4 focus:outline-none focus:border-pink-400"
            autoFocus
          />
          <button onClick={submit} className="bg-pink-500 px-8 py-3 rounded-xl text-xl font-bold">Submit</button>
          {feedback && <div className={`mt-4 text-xl font-bold ${feedback.includes('Correct') ? 'text-green-400' : 'text-red-400'}`}>{feedback}</div>}
        </div>
      );
    }

    // === MEMORY GAME ===
    function MemoryGame({ difficulty, setScore }) {
      const pairs = difficulty === 'Easy' ? 6 : difficulty === 'Medium' ? 8 : 12;
      const emojis = ['🍎','🍌','🍇','🍊','🍓','🍉','🥝','🍍','🥭','🍑','🍒','🥥','🍋','🍈'];
      const [cards, setCards] = useState([]);
      const [flipped, setFlipped] = useState([]);
      const [matched, setMatched] = useState([]);

      useEffect(() => {
        const selected = emojis.slice(0, pairs);
        const deck = [...selected, ...selected].sort(() => Math.random() - 0.5).map((e, i) => ({ id: i, emoji: e }));
        setCards(deck);
      }, [difficulty]);

      const flip = (id) => {
        if (flipped.length >= 2 || flipped.includes(id) || matched.includes(id)) return;
        const newFlipped = [...flipped, id];
        setFlipped(newFlipped);
        if (newFlipped.length === 2) {
          const [a, b] = newFlipped;
          if (cards[a].emoji === cards[b].emoji) {
            setMatched(m => [...m, a, b]);
            setScore(s => s + 20);
            setFlipped([]);
          } else {
            setTimeout(() => setFlipped([]), 800);
          }
        }
      };

      return (
        <div className="grid grid-cols-4 sm:grid-cols-6 gap-2 w-full max-w-lg">
          {cards.map(card => (
            <div
              key={card.id}
              onClick={() => flip(card.id)}
              className={`aspect-square rounded-xl flex items-center justify-center text-3xl cursor-pointer transition-all ${
                flipped.includes(card.id) || matched.includes(card.id) ? 'bg-white/30' : 'bg-pink-500/80'
              }`}
            >
              {(flipped.includes(card.id) || matched.includes(card.id)) ? card.emoji : '?'}
            </div>
          ))}
        </div>
      );
    }

    // === REACTION GAME ===
    function ReactionGame({ difficulty, setScore }) {
      const [state, setState] = useState('waiting'); // waiting, ready, click
      const [message, setMessage] = useState('Click to start');
      const timeoutRef = useRef(null);

      const start = () => {
        setState('waiting');
        setMessage('Wait for green...');
        const delay = 1000 + Math.random() * (difficulty === 'Easy' ? 3000 : difficulty === 'Medium' ? 2000 : 1500);
        timeoutRef.current = setTimeout(() => {
          setState('ready');
          setMessage('CLICK NOW!');
        }, delay);
      };

      const click = () => {
        if (state === 'ready') {
          setScore(s => s + (difficulty === 'Easy' ? 15 : difficulty === 'Medium' ? 20 : 30));
          setMessage('Great! +points');
          setState('waiting');
          setTimeout(start, 500);
        } else if (state === 'waiting') {
          clearTimeout(timeoutRef.current);
          setMessage('Too early!');
          setTimeout(start, 1000);
        }
      };

      useEffect(() => { start(); return () => clearTimeout(timeoutRef.current); }, []);

      return (
        <div onClick={click} className={`w-full max-w-md h-64 rounded-3xl flex items-center justify-center text-3xl font-bold cursor-pointer transition-colors ${
          state === 'ready' ? 'bg-green-500' : state === 'waiting' ? 'bg-red-500/70' : 'bg-white/20'
        }`}>
          {message}
        </div>
      );
    }

    // === WORD SCRAMBLE ===
    function ScrambleGame({ difficulty, setScore }) {
      const words = {
        Easy: ['CAT', 'DOG', 'SUN', 'BALL', 'TREE', 'FISH', 'BIRD', 'CAKE'],
        Medium: ['APPLE', 'HOUSE', 'WATER', 'MUSIC', 'HAPPY', 'GREEN', 'LIGHT'],
        Hard: ['COMPUTER', 'ELEPHANT', 'MOUNTAIN', 'RAINBOW', 'ADVENTURE', 'CHOCOLATE']
      };
      const [word, setWord] = useState('');
      const [scrambled, setScrambled] = useState('');
      const [input, setInput] = useState('');

      const newWord = useCallback(() => {
        const list = words[difficulty] || words.Medium;
        const w = list[Math.floor(Math.random() * list.length)];
        const scr = w.split('').sort(() => Math.random() - 0.5).join('');
        setWord(w);
        setScrambled(scr === w ? w.split('').reverse().join('') : scr);
        setInput('');
      }, [difficulty]);

      useEffect(() => { newWord(); }, [newWord]);

      const check = () => {
        if (input.toUpperCase() === word) {
          setScore(s => s + (difficulty === 'Easy' ? 15 : difficulty === 'Medium' ? 25 : 35));
          setTimeout(newWord, 300);
        }
      };

      return (
        <div className="text-center w-full max-w-md">
          <div className="text-5xl font-bold tracking-widest mb-6">{scrambled}</div>
          <input
            value={input}
            onChange={e => setInput(e.target.value.toUpperCase())}
            onKeyPress={e => e.key === 'Enter' && check()}
            className="w-full text-center text-2xl py-3 rounded-xl bg-white/20 mb-4"
            placeholder="Type the word"
            autoFocus
          />
          <button onClick={check} className="bg-pink-500 px-6 py-2 rounded-xl">Check</button>
        </div>
      );
    }

    // === SEQUENCE GAME ===
    function SequenceGame({ difficulty, setScore }) {
      const [seq, setSeq] = useState([]);
      const [answer, setAnswer] = useState('');
      const [next, setNext] = useState(0);

      const generate = useCallback(() => {
        const start = Math.floor(Math.random() * 10) + 1;
        const step = difficulty === 'Easy' ? Math.floor(Math.random() * 3) + 1 : difficulty === 'Medium' ? Math.floor(Math.random() * 5) + 2 : Math.floor(Math.random() * 7) + 3;
        const len = difficulty === 'Easy' ? 4 : difficulty === 'Medium' ? 5 : 6;
        const s = [];
        for (let i = 0; i < len; i++) s.push(start + i * step);
        setSeq(s);
        setNext(start + len * step);
        setAnswer('');
      }, [difficulty]);

      useEffect(() => { generate(); }, [generate]);

      const submit = () => {
        if (parseInt(answer) === next) {
          setScore(s => s + 20);
          generate();
        }
      };

      return (
        <div className="text-center w-full max-w-md">
          <div className="text-4xl font-bold mb-6">{seq.join(', ')}, ?</div>
          <input
            type="number"
            value={answer}
            onChange={e => setAnswer(e.target.value)}
            onKeyPress={e => e.key === 'Enter' && submit()}
            className="w-full text-center text-3xl py-4 rounded-2xl bg-white/20 mb-4"
            autoFocus
          />
          <button onClick={submit} className="bg-pink-500 px-8 py-3 rounded-xl text-xl">Submit</button>
        </div>
      );
    }

    // === TYPING GAME ===
    function TypingGame({ difficulty, setScore }) {
      const wordLists = {
        Easy: ['cat', 'dog', 'sun', 'run', 'jump', 'play', 'happy', 'fast'],
        Medium: ['apple', 'banana', 'computer', 'keyboard', 'challenge', 'awesome'],
        Hard: ['extraordinary', 'imagination', 'development', 'programming', 'opportunity']
      };
      const [current, setCurrent] = useState('');
      const [input, setInput] = useState('');

      const nextWord = useCallback(() => {
        const list = wordLists[difficulty] || wordLists.Medium;
        setCurrent(list[Math.floor(Math.random() * list.length)]);
        setInput('');
      }, [difficulty]);

      useEffect(() => { nextWord(); }, [nextWord]);

      const handleChange = (e) => {
        const val = e.target.value;
        setInput(val);
        if (val.toLowerCase() === current) {
          setScore(s => s + (difficulty === 'Easy' ? 10 : difficulty === 'Medium' ? 15 : 25));
          nextWord();
        }
      };

      return (
        <div className="text-center w-full max-w-md">
          <div className="text-4xl font-bold mb-6 text-yellow-300">{current}</div>
          <input
            value={input}
            onChange={handleChange}
            className="w-full text-center text-2xl py-4 rounded-2xl bg-white/20 border-2 border-transparent focus:border-pink-400"
            placeholder="Type here..."
            autoFocus
          />
        </div>
      );
    }

    // === COLOR MATCH ===
    function ColorGame({ difficulty, setScore }) {
      const colors = ['RED', 'BLUE', 'GREEN', 'YELLOW', 'PURPLE', 'ORANGE', 'PINK', 'WHITE'];
      const colorMap = { RED: 'text-red-500', BLUE: 'text-blue-500', GREEN: 'text-green-500', YELLOW: 'text-yellow-400', PURPLE: 'text-purple-500', ORANGE: 'text-orange-500', PINK: 'text-pink-500', WHITE: 'text-white' };
      const [word, setWord] = useState('');
      const [displayColor, setDisplayColor] = useState('');
      const [correct, setCorrect] = useState(true);

      const generate = useCallback(() => {
        const w = colors[Math.floor(Math.random() * colors.length)];
        const c = difficulty === 'Easy' ? w : colors[Math.floor(Math.random() * colors.length)];
        setWord(w);
        setDisplayColor(c);
        setCorrect(w === c || difficulty === 'Easy');
      }, [difficulty]);

      useEffect(() => { generate(); }, [generate]);

      const choose = (isMatch) => {
        const isCorrectChoice = (word === displayColor) === isMatch;
        if (isCorrectChoice) {
          setScore(s => s + 15);
        }
        generate();
      };

      return (
        <div className="text-center">
          <div className={`text-6xl font-bold mb-8 ${colorMap[displayColor] || 'text-white'}`}>{word}</div>
          <div className="flex gap-4 justify-center">
            <button onClick={() => choose(true)} className="bg-green-500 px-8 py-4 rounded-xl text-xl font-bold">MATCH</button>
            <button onClick={() => choose(false)} className="bg-red-500 px-8 py-4 rounded-xl text-xl font-bold">NO MATCH</button>
          </div>
        </div>
      );
    }

    // === TRIVIA GAME ===
    function TriviaGame({ difficulty, setScore }) {
      const questions = {
        Easy: [
          { q: 'What color is the sky?', a: ['Blue', 'Green', 'Red'], correct: 0 },
          { q: 'How many legs does a dog have?', a: ['2', '4', '6'], correct: 1 },
          { q: 'What is 2 + 2?', a: ['3', '4', '5'], correct: 1 },
        ],
        Medium: [
          { q: 'Capital of France?', a: ['London', 'Paris', 'Berlin'], correct: 1 },
          { q: 'Largest planet?', a: ['Earth', 'Jupiter', 'Mars'], correct: 1 },
          { q: 'Who painted Mona Lisa?', a: ['Van Gogh', 'Da Vinci', 'Picasso'], correct: 1 },
        ],
        Hard: [
          { q: 'Speed of light approx?', a: ['300,000 km/s', '150,000 km/s', '500,000 km/s'], correct: 0 },
          { q: 'Atomic number of Carbon?', a: ['6', '8', '12'], correct: 0 },
          { q: 'Year WWII ended?', a: ['1943', '1945', '1950'], correct: 1 },
        ]
      };
      const [qIndex, setQIndex] = useState(0);
      const qs = questions[difficulty] || questions.Medium;
      const q = qs[qIndex % qs.length];

      const answer = (idx) => {
        if (idx === q.correct) setScore(s => s + 25);
        setQIndex(i => i + 1);
      };

      return (
        <div className="text-center w-full max-w-lg">
          <div className="text-2xl mb-8">{q.q}</div>
          <div className="space-y-3">
            {q.a.map((opt, i) => (
              <button key={i} onClick={() => answer(i)} className="w-full bg-white/20 py-4 rounded-xl text-lg hover:bg-pink-500/50 transition">
                {opt}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // === SNAKE GAME (simplified) ===
    function SnakeGame({ difficulty, setScore }) {
      const [snake, setSnake] = useState([{x: 10, y: 10}]);
      const [food, setFood] = useState({x: 15, y: 15});
      const [dir, setDir] = useState({x: 1, y: 0});
      const gridSize = 20;
      const speed = difficulty === 'Easy' ? 200 : difficulty === 'Medium' ? 150 : 100;

      useEffect(() => {
        const handleKey = (e) => {
          if (e.key === 'ArrowUp' && dir.y === 0) setDir({x: 0, y: -1});
          if (e.key === 'ArrowDown' && dir.y === 0) setDir({x: 0, y: 1});
          if (e.key === 'ArrowLeft' && dir.x === 0) setDir({x: -1, y: 0});
          if (e.key === 'ArrowRight' && dir.x === 0) setDir({x: 1, y: 0});
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [dir]);

      useEffect(() => {
        const interval = setInterval(() => {
          setSnake(s => {
            const head = { x: s[0].x + dir.x, y: s[0].y + dir.y };
            // wrap
            head.x = (head.x + gridSize) % gridSize;
            head.y = (head.y + gridSize) % gridSize;
            const newSnake = [head, ...s];
            if (head.x === food.x && head.y === food.y) {
              setScore(sc => sc + 10);
              setFood({ x: Math.floor(Math.random() * gridSize), y: Math.floor(Math.random() * gridSize) });
              return newSnake;
            }
            newSnake.pop();
            return newSnake;
          });
        }, speed);
        return () => clearInterval(interval);
      }, [dir, food, speed]);

      return (
        <div className="relative bg-black/40 rounded-2xl" style={{ width: 400, height: 400 }}>
          {snake.map((seg, i) => (
            <div key={i} className="absolute bg-green-400 rounded-sm" style={{
              left: `${seg.x * 20}px`, top: `${seg.y * 20}px`, width: 18, height: 18
            }} />
          ))}
          <div className="absolute bg-red-500 rounded-full" style={{
            left: `${food.x * 20}px`, top: `${food.y * 20}px`, width: 18, height: 18
          }} />
          <div className="absolute bottom-2 left-2 text-xs text-white/60">Use arrow keys</div>
        </div>
      );
    }

    // === SLIDE PUZZLE (simplified 3x3) ===
    function PuzzleGame({ difficulty, setScore }) {
      const size = difficulty === 'Easy' ? 3 : difficulty === 'Medium' ? 3 : 4;
      const [tiles, setTiles] = useState([]);
      const empty = size * size - 1;

      useEffect(() => {
        const arr = Array.from({length: size*size}, (_, i) => i);
        // shuffle
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        setTiles(arr);
      }, [difficulty]);

      const move = (index) => {
        const emptyIndex = tiles.indexOf(empty);
        const row = Math.floor(index / size);
        const col = index % size;
        const eRow = Math.floor(emptyIndex / size);
        const eCol = emptyIndex % size;
        if ((Math.abs(row - eRow) + Math.abs(col - eCol)) === 1) {
          const newTiles = [...tiles];
          [newTiles[index], newTiles[emptyIndex]] = [newTiles[emptyIndex], newTiles[index]];
          setTiles(newTiles);
          if (newTiles.every((t, i) => t === i)) {
            setScore(s => s + 100);
          }
        }
      };

      return (
        <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${size}, 70px)` }}>
          {tiles.map((tile, i) => (
            <div
              key={i}
              onClick={() => move(i)}
              className={`w-[70px] h-[70px] rounded-lg flex items-center justify-center text-2xl font-bold cursor-pointer ${
                tile === empty ? 'bg-transparent' : 'bg-pink-500 hover:bg-pink-400'
              }`}
            >
              {tile === empty ? '' : tile + 1}
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

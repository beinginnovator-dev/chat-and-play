<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat & Play - Timed Challenges</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .game-card:hover { transform: translateY(-4px); transition: all 0.2s; }
    .timer { font-variant-numeric: tabular-nums; }
    .floating-msg { background: rgba(0,0,0,0.88); color: #f8fafc; border: 1px solid rgba(236,72,153,0.6); text-shadow: 0 1px 3px rgba(0,0,0,0.8);   
      position: absolute;
      animation: floatUp 5s ease-out forwards;
      left: 50%;
      transform: translateX(-50%);
    }
    @keyframes floatUp {
      0% { opacity: 1; bottom: 120px; }
      100% { opacity: 0; bottom: 80vh; }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 min-h-screen text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const GAMES = [
      { id: 'memory', name: 'Memory Match', icon: 'fa-brain', desc: 'Flip cards and match pairs', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'scramble', name: 'Word Scramble', icon: 'fa-font', desc: 'Unscramble the words', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'sequence', name: 'Number Sequence', icon: 'fa-list-ol', desc: 'Find the next number in sequence', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'typing', name: 'Typing Speed', icon: 'fa-keyboard', desc: 'Type the words as fast as possible', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'trivia', name: 'General Knowledge', icon: 'fa-graduation-cap', desc: 'Answer general knowledge questions', difficulties: ['Easy', 'Medium', 'Hard'] },
      { id: 'puzzle', name: 'Slide Puzzle', icon: 'fa-puzzle-piece', desc: 'Slide tiles to solve the puzzle', difficulties: ['Easy', 'Medium', 'Hard'] },
    ];

    const TIMES = [1, 2, 5];
    const MAX_PLAYERS = 10;

    function App() {
      const [username, setUsername] = useState(localStorage.getItem('username') || '');
      const [screen, setScreen] = useState(username ? 'home' : 'login');
      const [selectedGame, setSelectedGame] = useState(null);
      const [difficulty, setDifficulty] = useState('Medium');
      const [timeLimit, setTimeLimit] = useState(1);
      const [challengeCode, setChallengeCode] = useState('');
      const [joinCode, setJoinCode] = useState('');
      const [playVsAI, setPlayVsAI] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { user: 'System', text: 'Welcome to Chat & Play! Invite friends or play vs AI.', time: new Date().toLocaleTimeString() }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [scores, setScores] = useState(JSON.parse(localStorage.getItem('scores') || '[]'));
      const chatEndRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('username', username);
      }, [username]);

      // Auto-join from URL
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const join = params.get('join');
        if (join && username && screen === 'home') {
          setJoinCode(join);
          setTimeout(() => joinChallenge(), 500);
          // Clean URL
          window.history.replaceState({}, '', window.location.pathname);
        }
      }, [username, screen]);


      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);

      const addChat = (user, text) => {
        setChatMessages(prev => [...prev.slice(-30), { user, text, time: new Date().toLocaleTimeString(), id: Date.now() }]);
      };

      const handleLogin = () => {
        if (username.trim()) setScreen('home');
      };

      const startGame = (game) => {
        setSelectedGame(game);
        setPlayVsAI(false);
        setScreen('setup');
      };

      const beginChallenge = (vsAI = false) => {
        const code = vsAI ? 'AI-' + Math.random().toString(36).substring(2, 6).toUpperCase() : Math.random().toString(36).substring(2, 8).toUpperCase();
        setChallengeCode(code);
        setPlayVsAI(vsAI);
        if (vsAI) {
          addChat('System', `${username} started a match vs AI: ${selectedGame.name} (${difficulty})`);
        } else {
          addChat('System', `${username} created a challenge: ${selectedGame.name} (${difficulty}, ${timeLimit} min). Code: ${code}`);
          // Track participants
          const key = `participants_${code}`;
          const parts = JSON.parse(localStorage.getItem(key) || '[]');
          if (!parts.includes(username) && parts.length < MAX_PLAYERS) {
            parts.push(username);
            localStorage.setItem(key, JSON.stringify(parts));
          }
        }
        setScreen('playing');
      };

      const joinChallenge = () => {
        const code = joinCode.trim().toUpperCase();
        if (code.length >= 4) {
          const key = `participants_${code}`;
          const parts = JSON.parse(localStorage.getItem(key) || '[]');
          if (parts.length >= MAX_PLAYERS && !parts.includes(username)) {
            alert(`This challenge is full (max ${MAX_PLAYERS} players)`);
            return;
          }
          if (!parts.includes(username)) {
            parts.push(username);
            localStorage.setItem(key, JSON.stringify(parts));
          }
          addChat('System', `${username} joined challenge with code ${code}`);
          setChallengeCode(code);
          setPlayVsAI(false);
          setScreen('playing');
        }
      };

      const shareWhatsApp = (codeOverride) => {
        const code = codeOverride || challengeCode || 'XXXXXX';
        const base = window.location.href.split('?')[0];
        const joinLink = `${base}?join=${code}`;
        const text = `🎮 Challenge me on Chat & Play!\n\nGame: ${selectedGame?.name || 'Fun Game'}\nDifficulty: ${difficulty}\nTime: ${timeLimit} min\n\nJoin here: ${joinLink}`;
        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
      };

      const saveScore = (score) => {
        const newScore = {
          username,
          game: selectedGame.name,
          difficulty,
          time: timeLimit,
          score,
          date: new Date().toISOString(),
          code: challengeCode,
          vsAI: playVsAI
        };
        const updated = [newScore, ...scores].slice(0, 50);
        setScores(updated);
        localStorage.setItem('scores', JSON.stringify(updated));

        if (challengeCode) {
          const key = `challenge_${challengeCode}`;
          const existing = JSON.parse(localStorage.getItem(key) || '[]');
          const filtered = existing.filter(s => s.username !== username);
          const both = [...filtered, { username, score, isAI: false }];
          localStorage.setItem(key, JSON.stringify(both));
        }
        addChat('System', `${username} scored ${score} points!`);
      };

      const getChallengeScores = (code) => {
        if (!code) return [];
        return JSON.parse(localStorage.getItem(`challenge_${code}`) || '[]');
      };

      if (screen === 'login') {
        return (
          <div className="flex items-center justify-center min-h-screen p-4">
            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 max-w-md w-full border border-white/20 shadow-2xl">
              <h1 className="text-4xl font-bold text-center mb-2">🎮 Chat & Play</h1>
              <p className="text-center text-white/70 mb-8">Timed challenges with friends or AI</p>
              <input
                type="text"
                placeholder="Enter your username"
                value={username}
                onChange={e => setUsername(e.target.value)}
                onKeyPress={e => e.key === 'Enter' && handleLogin()}
                className="w-full px-4 py-3 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-pink-400 mb-4"
              />
              <button
                onClick={handleLogin}
                className="w-full bg-gradient-to-r from-pink-500 to-purple-600 py-3 rounded-xl font-semibold hover:opacity-90 transition"
              >
                Start Playing
              </button>
            </div>
          </div>
        );
      }

      if (screen === 'home') {
        return (
          <div className="min-h-screen p-4 md:p-8 pb-40">
            <header className="flex justify-between items-center mb-6">
              <div>
                <h1 className="text-3xl font-bold">🎮 Chat & Play</h1>
                <p className="text-white/70">Welcome, {username}!</p>
              </div>
              <button onClick={() => setScreen('scores')} className="bg-white/10 px-4 py-2 rounded-xl hover:bg-white/20">
                <i className="fas fa-trophy mr-2"></i>Scores
              </button>
            </header>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
              {GAMES.map(game => (
                <div key={game.id} onClick={() => startGame(game)} className="game-card bg-white/10 backdrop-blur rounded-2xl p-5 cursor-pointer border border-white/10 hover:border-pink-400">
                  <div className="text-4xl mb-3 text-pink-300"><i className={`fas ${game.icon}`}></i></div>
                  <h3 className="font-bold text-lg">{game.name}</h3>
                  <p className="text-sm text-white/60 mt-1">{game.desc}</p>
                </div>
              ))}
            </div>

            <div className="bg-white/10 backdrop-blur rounded-2xl p-4 max-w-md mb-4">
              <h3 className="font-bold mb-2"><i className="fas fa-key mr-2"></i>Join a Challenge</h3>
              <div className="flex gap-2">
                <input
                  placeholder="Enter challenge code"
                  value={joinCode}
                  onChange={e => setJoinCode(e.target.value.toUpperCase())}
                  className="flex-1 px-3 py-2 rounded-lg bg-white/20 border border-white/30"
                />
                <button onClick={joinChallenge} className="bg-pink-500 px-4 py-2 rounded-lg font-semibold">Join</button>
              </div>
              <p className="text-xs text-white/50 mt-2">Max {MAX_PLAYERS} players per challenge</p>
            </div>
          </div>
        );
      }

      if (screen === 'setup') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 max-w-lg w-full border border-white/20">
              <button onClick={() => setScreen('home')} className="text-white/60 mb-4 hover:text-white">← Back</button>
              <div className="text-5xl mb-4 text-center text-pink-300"><i className={`fas ${selectedGame.icon}`}></i></div>
              <h2 className="text-3xl font-bold text-center mb-2">{selectedGame.name}</h2>
              <p className="text-center text-white/70 mb-6">{selectedGame.desc}</p>

              <div className="mb-4">
                <label className="block text-sm mb-2">Difficulty</label>
                <div className="flex gap-2">
                  {selectedGame.difficulties.map(d => (
                    <button key={d} onClick={() => setDifficulty(d)} className={`flex-1 py-2 rounded-xl ${difficulty === d ? 'bg-pink-500' : 'bg-white/10'}`}>
                      {d}
                    </button>
                  ))}
                </div>
              </div>

              <div className="mb-6">
                <label className="block text-sm mb-2">Time Limit</label>
                <div className="flex gap-2">
                  {TIMES.map(t => (
                    <button key={t} onClick={() => setTimeLimit(t)} className={`flex-1 py-2 rounded-xl ${timeLimit === t ? 'bg-purple-500' : 'bg-white/10'}`}>
                      {t} min
                    </button>
                  ))}
                </div>
              </div>

              <button onClick={() => beginChallenge(false)} className="w-full bg-gradient-to-r from-green-500 to-emerald-600 py-3 rounded-xl font-bold text-lg mb-3">
                Create Challenge & Play
              </button>
              <button onClick={() => beginChallenge(true)} className="w-full bg-gradient-to-r from-blue-500 to-indigo-600 py-3 rounded-xl font-bold text-lg mb-3">
                <i className="fas fa-robot mr-2"></i> Play vs AI
              </button>
              <button onClick={() => shareWhatsApp()} className="w-full bg-green-600/80 py-2 rounded-xl font-semibold flex items-center justify-center gap-2">
                <i className="fab fa-whatsapp"></i> Invite on WhatsApp
              </button>
            </div>
          </div>
        );
      }

      if (screen === 'playing') {
        return <GamePlayer 
          game={selectedGame} 
          difficulty={difficulty} 
          timeLimit={timeLimit * 60} 
          username={username}
          challengeCode={challengeCode}
          playVsAI={playVsAI}
          chatMessages={chatMessages}
          addChat={addChat}
          shareWhatsApp={shareWhatsApp}
          onFinish={(score) => { saveScore(score); setScreen('result'); }}
          onExit={() => setScreen('home')}
        />;
      }

      if (screen === 'result') {
        const challengeScores = getChallengeScores(challengeCode);
        const myScore = challengeScores.find(s => s.username === username)?.score || 0;
        let opponents = challengeScores.filter(s => s.username !== username);
        
        // If vs AI and no AI score yet, generate one
        if (playVsAI && opponents.length === 0) {
          const aiScore = Math.floor(myScore * (0.7 + Math.random() * 0.6)); // AI score around player's
          opponents = [{ username: 'AI Opponent', score: aiScore, isAI: true }];
          // Save AI score too
          const key = `challenge_${challengeCode}`;
          localStorage.setItem(key, JSON.stringify([...challengeScores, opponents[0]]));
        }

        const bestOpponent = opponents.length ? Math.max(...opponents.map(o => o.score)) : 0;
        const isWinner = myScore > bestOpponent;
        const isTie = opponents.length && myScore === bestOpponent;

        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white/10 backdrop-blur-lg rounded-3xl p-8 max-w-md w-full text-center border border-white/20">
              <div className="text-6xl mb-4">{isWinner ? '🏆' : isTie ? '🤝' : '🥈'}</div>
              <h2 className="text-3xl font-bold mb-2">
                {isWinner ? 'You Win!' : isTie ? 'It\'s a Tie!' : 'Good Try!'}
              </h2>
              <div className="my-6 space-y-2">
                <div className="bg-white/10 rounded-xl p-3 flex justify-between items-center">
                  <span className="font-semibold">{username} (You)</span>
                  <span className="font-bold text-green-400 text-xl">{myScore}</span>
                </div>
                {opponents.map((opp, i) => (
                  <div key={i} className="bg-white/10 rounded-xl p-3 flex justify-between items-center">
                    <span>{opp.username} {opp.isAI && <i className="fas fa-robot ml-1 text-blue-300"></i>}</span>
                    <span className="font-bold text-yellow-400">{opp.score}</span>
                  </div>
                ))}
              </div>
              {isWinner && <p className="text-xl text-yellow-300 mb-4 animate-pulse">🎉 Congratulations! 🎉</p>}
              {challengeCode && <p className="bg-white/20 inline-block px-4 py-2 rounded-full mb-4 text-sm">Code: {challengeCode}</p>}
              <button onClick={() => { setPlayVsAI(true); setScreen("playing"); }} className="w-full bg-indigo-600 py-3 rounded-xl font-semibold mb-3 flex items-center justify-center gap-2">
                <i className="fas fa-eye"></i> Watch AI Play
              </button>
              <button onClick={() => shareWhatsApp(challengeCode)} className="w-full bg-green-600 py-3 rounded-xl font-semibold mb-3 flex items-center justify-center gap-2">
                <i className="fab fa-whatsapp"></i> Share on WhatsApp
              </button>
              <button onClick={() => setScreen("home")} className="w-full bg-white/20 py-3 rounded-xl">Back to Games</button>
              <button onClick={() => setScreen('home')} className="w-full bg-white/20 py-3 rounded-xl">Back to Games</button>
            </div>
          </div>
        );
      }

      if (screen === 'scores') {
        return (
          <div className="min-h-screen p-4 md:p-8">
            <button onClick={() => setScreen('home')} className="mb-4 text-white/70">← Back</button>
            <h2 className="text-3xl font-bold mb-6">🏆 Recent Scores</h2>
            <div className="space-y-3 max-w-2xl">
              {scores.length === 0 ? <p className="text-white/60">No scores yet. Play a game!</p> : scores.map((s, i) => (
                <div key={i} className="bg-white/10 rounded-xl p-4 flex justify-between items-center">
                  <div>
                    <div className="font-bold">{s.username} - {s.game} {s.vsAI && <span className="text-xs bg-blue-500/50 px-2 py-0.5 rounded ml-1">vs AI</span>}</div>
                    <div className="text-sm text-white/60">{s.difficulty} • {s.time} min • Code: {s.code || '-'}</div>
                  </div>
                  <div className="text-2xl font-bold text-yellow-400">{s.score}</div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return null;
    }

    function GamePlayer({ game, difficulty, timeLimit, username, challengeCode, playVsAI, chatMessages, addChat, shareWhatsApp, onFinish, onExit }) {
      const [timeLeft, setTimeLeft] = useState(timeLimit);
      const [score, setScore] = useState(0);
      const [gameOver, setGameOver] = useState(false);
      const [chatInput, setChatInput] = useState('');
      const [floatingMsgs, setFloatingMsgs] = useState([]);
      const [showMini, setShowMini] = useState(true);
      const [liveScores, setLiveScores] = useState([]);
      const timerRef = useRef(null);
      const chatEndRef = useRef(null);

      useEffect(() => {
        timerRef.current = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 1) {
              clearInterval(timerRef.current);
              setGameOver(true);
              return 0;
            }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(timerRef.current);
      }, []);

      useEffect(() => {
        if (gameOver) {
          setTimeout(() => onFinish(score), 1800);
        }
      }, [gameOver, score]);

      // Poll live scores for the challenge
      useEffect(() => {
        if (!challengeCode || playVsAI) return;
        const interval = setInterval(() => {
          const key = `challenge_${challengeCode}`;
          const scores = JSON.parse(localStorage.getItem(key) || '[]');
          setLiveScores(scores.filter(s => s.username !== username).slice(0, 9)); // max others
        }, 2000);
        return () => clearInterval(interval);
      }, [challengeCode, playVsAI, username]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages]);

      const sendMessage = () => {
        if (chatInput.trim()) {
          addChat(username, chatInput);
          setFloatingMsgs(prev => [...prev, { text: chatInput, id: Date.now(), user: username }]);
          setTimeout(() => setFloatingMsgs(prev => prev.slice(1)), 5000);
          setChatInput('');
        }
      };

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, '0')}`;
      };

      return (
        <div className="min-h-screen flex flex-col relative">
          {/* Top bar with scores */}
          <div className="bg-black/40 p-3 flex flex-wrap justify-between items-center gap-2 border-b border-white/10">
            <div className="flex items-center gap-3">
              <h2 className="text-lg font-bold"><i className={`fas ${game.icon} mr-1`}></i>{game.name}</h2>
              <span className="text-xs bg-white/20 px-2 py-1 rounded">{difficulty}</span>
              {playVsAI && <span className="text-xs bg-blue-500/50 px-2 py-1 rounded"><i className="fas fa-robot mr-1"></i>vs AI</span>}
            </div>
            <div className="flex items-center gap-4">
              <div className="text-right">
                <div className="text-2xl font-bold timer text-yellow-400">{formatTime(timeLeft)}</div>
                <div className="text-sm">You: <span className="font-bold text-green-400">{score}</span></div>
              </div>
              {!playVsAI && liveScores.length > 0 && (
                <div className="text-xs max-w-[140px]">
                  {liveScores.slice(0, 3).map((s, i) => (
                    <div key={i} className="truncate">{s.username}: <span className="text-yellow-300">{s.score}</span></div>
                  ))}
                  {liveScores.length > 3 && <div>+{liveScores.length - 3} more</div>}
                </div>
              )}
              <button onClick={onExit} className="bg-red-500/80 px-3 py-1 rounded-lg text-sm">Exit</button>
              <button onClick={() => shareWhatsApp(challengeCode)} className="bg-green-600 px-3 py-1 rounded-lg text-sm">
                <i className="fab fa-whatsapp"></i>
              </button>
            </div>
          </div>

          <div className="flex-1 relative flex items-center justify-center p-4">
            
            {/* Mini other player activity window */}
            {showMini && (
              <div className="absolute top-2 right-2 w-48 bg-slate-900/95 border border-pink-400/50 rounded-xl shadow-2xl z-40 text-xs overflow-hidden">
                <div className="flex justify-between items-center px-2 py-1 bg-pink-600/40">
                  <span className="font-semibold">Others Activity</span>
                  <button onClick={() => setShowMini(false)} className="text-white/70 hover:text-white">−</button>
                </div>
                <div className="p-2 max-h-32 overflow-y-auto">
                  {liveScores.length === 0 ? (
                    <div className="text-white/50">Waiting for others...</div>
                  ) : (
                    liveScores.map((s, i) => (
                      <div key={i} className="flex justify-between py-0.5">
                        <span className="truncate">{s.username}</span>
                        <span className="text-yellow-300 font-bold">{s.score}</span>
                      </div>
                    ))
                  )}
                  {playVsAI && <div className="mt-1 text-blue-300">AI is playing...</div>}
                </div>
              </div>
            )}
            {!showMini && (
              <button onClick={() => setShowMini(true)} className="absolute top-2 right-2 bg-pink-600/80 px-2 py-1 rounded-lg text-xs z-40">
                <i className="fas fa-users"></i>
              </button>
            )}

            {/* Floating messages from bottom */}
            {floatingMsgs.map(m => (
              <div key={m.id} className="floating-msg px-4 py-2 rounded-full text-sm font-semibold shadow-2xl z-30 whitespace-nowrap">
                {m.user}: {m.text}
              </div>
            ))}

            {gameOver ? (
              <div className="text-center">
                <div className="text-6xl mb-4">⏰</div>
                <h3 className="text-3xl font-bold">Time's Up!</h3>
                <p className="text-xl mt-2">Your Score: {score}</p>
              </div>
            ) : (
              <GameContent 
                gameId={game.id} 
                difficulty={difficulty} 
                score={score} 
                setScore={setScore} 
                timeLeft={timeLeft}
              />
            )}
          </div>

          {/* Chat below game */}
          <div className="bg-slate-900/90 border-t border-pink-500/40 p-3">
            <div className="max-h-28 overflow-y-auto mb-2 text-sm space-y-1">
              {chatMessages.slice(-10).map((m, i) => (
                <div key={m.id || i} className={m.user === 'System' ? 'text-yellow-300' : ''}>
                  <span className="font-bold text-pink-300">{m.user}:</span> {m.text}
                </div>
              ))}
              <div ref={chatEndRef} />
            </div>
            <div className="flex gap-2">
              <input
                value={chatInput}
                onChange={e => setChatInput(e.target.value)}
                onKeyPress={e => e.key === 'Enter' && sendMessage()}
                placeholder="Send floating message..."
                className="flex-1 px-3 py-2 rounded-lg bg-white/10 text-sm"
              />
              <button onClick={sendMessage} className="bg-pink-500 px-4 rounded-lg">
                <i className="fas fa-paper-plane"></i>
              </button>
            </div>
          </div>
        </div>
      );
    }

    function GameContent({ gameId, difficulty, score, setScore, timeLeft }) {
      if (gameId === 'memory') return <MemoryGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'scramble') return <ScrambleGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'sequence') return <SequenceGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'typing') return <TypingGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'trivia') return <TriviaGame difficulty={difficulty} setScore={setScore} />;
      if (gameId === 'puzzle') return <PuzzleGame difficulty={difficulty} setScore={setScore} />;
      return <div>Game not found</div>;
    }

    // --- Game components (unchanged logic, kept for completeness) ---
    function MemoryGame({ difficulty, setScore }) {
      const pairs = difficulty === 'Easy' ? 6 : difficulty === 'Medium' ? 8 : 12;
      const emojis = ['🍎','🍌','🍇','🍊','🍓','🍉','🥝','🍍','🥭','🍑','🍒','🥥','🍋','🍈'];
      const [cards, setCards] = useState([]);
      const [flipped, setFlipped] = useState([]);
      const [matched, setMatched] = useState([]);

      useEffect(() => {
        const selected = emojis.slice(0, pairs);
        const deck = [...selected, ...selected].sort(() => Math.random() - 0.5).map((e, i) => ({ id: i, emoji: e }));
        setCards(deck);
      }, [difficulty]);

      const flip = (id) => {
        if (flipped.length >= 2 || flipped.includes(id) || matched.includes(id)) return;
        const newFlipped = [...flipped, id];
        setFlipped(newFlipped);
        if (newFlipped.length === 2) {
          const [a, b] = newFlipped;
          if (cards[a].emoji === cards[b].emoji) {
            setMatched(m => [...m, a, b]);
            setScore(s => s + 20);
            setFlipped([]);
          } else {
            setTimeout(() => setFlipped([]), 800);
          }
        }
      };

      return (
        <div className="grid grid-cols-4 sm:grid-cols-6 gap-2 w-full max-w-lg">
          {cards.map(card => (
            <div key={card.id} onClick={() => flip(card.id)} className={`aspect-square rounded-xl flex items-center justify-center text-3xl cursor-pointer transition-all ${flipped.includes(card.id) || matched.includes(card.id) ? 'bg-white/30' : 'bg-pink-500/80'}`}>
              {(flipped.includes(card.id) || matched.includes(card.id)) ? card.emoji : '?'}
            </div>
          ))}
        </div>
      );
    }

    function ScrambleGame({ difficulty, setScore }) {
      const words = {
        Easy: ['CAT', 'DOG', 'SUN', 'BALL', 'TREE', 'FISH', 'BIRD', 'CAKE'],
        Medium: ['APPLE', 'HOUSE', 'WATER', 'MUSIC', 'HAPPY', 'GREEN', 'LIGHT'],
        Hard: ['COMPUTER', 'ELEPHANT', 'MOUNTAIN', 'RAINBOW', 'ADVENTURE', 'CHOCOLATE']
      };
      const [word, setWord] = useState('');
      const [scrambled, setScrambled] = useState('');
      const [input, setInput] = useState('');

      const newWord = useCallback(() => {
        const list = words[difficulty] || words.Medium;
        const w = list[Math.floor(Math.random() * list.length)];
        const scr = w.split('').sort(() => Math.random() - 0.5).join('');
        setWord(w);
        setScrambled(scr === w ? w.split('').reverse().join('') : scr);
        setInput('');
      }, [difficulty]);

      useEffect(() => { newWord(); }, [newWord]);

      const check = () => {
        if (input.toUpperCase() === word) {
          setScore(s => s + (difficulty === 'Easy' ? 15 : difficulty === 'Medium' ? 25 : 35));
          setTimeout(newWord, 300);
        }
      };

      return (
        <div className="text-center w-full max-w-md">
          <div className="text-5xl font-bold tracking-widest mb-6">{scrambled}</div>
          <input value={input} onChange={e => setInput(e.target.value.toUpperCase())} onKeyPress={e => e.key === 'Enter' && check()} className="w-full text-center text-2xl py-3 rounded-xl bg-white/20 mb-4" placeholder="Type the word" autoFocus />
          <button onClick={check} className="bg-pink-500 px-6 py-2 rounded-xl">Check</button>
        </div>
      );
    }

    function SequenceGame({ difficulty, setScore }) {
      const [seq, setSeq] = useState([]);
      const [answer, setAnswer] = useState('');
      const [next, setNext] = useState(0);

      const generate = useCallback(() => {
        const start = Math.floor(Math.random() * 10) + 1;
        const step = difficulty === 'Easy' ? Math.floor(Math.random() * 3) + 1 : difficulty === 'Medium' ? Math.floor(Math.random() * 5) + 2 : Math.floor(Math.random() * 7) + 3;
        const len = difficulty === 'Easy' ? 4 : difficulty === 'Medium' ? 5 : 6;
        const s = [];
        for (let i = 0; i < len; i++) s.push(start + i * step);
        setSeq(s);
        setNext(start + len * step);
        setAnswer('');
      }, [difficulty]);

      useEffect(() => { generate(); }, [generate]);

      const submit = () => {
        if (parseInt(answer) === next) {
          setScore(s => s + 20);
          generate();
        }
      };

      return (
        <div className="text-center w-full max-w-md">
          <div className="text-4xl font-bold mb-6">{seq.join(', ')}, ?</div>
          <input type="number" value={answer} onChange={e => setAnswer(e.target.value)} onKeyPress={e => e.key === 'Enter' && submit()} className="w-full text-center text-3xl py-4 rounded-2xl bg-white/20 mb-4" autoFocus />
          <button onClick={submit} className="bg-pink-500 px-8 py-3 rounded-xl text-xl">Submit</button>
        </div>
      );
    }

    function TypingGame({ difficulty, setScore }) {
      const wordLists = {
        Easy: ['cat', 'dog', 'sun', 'run', 'jump', 'play', 'happy', 'fast'],
        Medium: ['apple', 'banana', 'computer', 'keyboard', 'challenge', 'awesome'],
        Hard: ['extraordinary', 'imagination', 'development', 'programming', 'opportunity']
      };
      const [current, setCurrent] = useState('');
      const [input, setInput] = useState('');

      const nextWord = useCallback(() => {
        const list = wordLists[difficulty] || wordLists.Medium;
        setCurrent(list[Math.floor(Math.random() * list.length)]);
        setInput('');
      }, [difficulty]);

      useEffect(() => { nextWord(); }, [nextWord]);

      const handleChange = (e) => {
        const val = e.target.value;
        setInput(val);
        if (val.toLowerCase() === current) {
          setScore(s => s + (difficulty === 'Easy' ? 10 : difficulty === 'Medium' ? 15 : 25));
          nextWord();
        }
      };

      return (
        <div className="text-center w-full max-w-md">
          <div className="text-4xl font-bold mb-6 text-yellow-300">{current}</div>
          <input value={input} onChange={handleChange} className="w-full text-center text-2xl py-4 rounded-2xl bg-white/20 border-2 border-transparent focus:border-pink-400" placeholder="Type here..." autoFocus />
        </div>
      );
    }

    function TriviaGame({ difficulty, setScore }) {
      const questions = {
        Easy: [
          { q: 'What is the capital of France?', a: ['London', 'Paris', 'Berlin', 'Madrid'], correct: 1 },
          { q: 'How many continents are there?', a: ['5', '6', '7', '8'], correct: 2 },
          { q: 'What color is the sky on a clear day?', a: ['Green', 'Blue', 'Red', 'Yellow'], correct: 1 },
          { q: 'Which animal is known as the King of the Jungle?', a: ['Tiger', 'Lion', 'Elephant', 'Bear'], correct: 1 },
          { q: 'How many days are in a leap year?', a: ['365', '366', '364', '367'], correct: 1 },
        ],
        Medium: [
          { q: 'Who painted the Mona Lisa?', a: ['Van Gogh', 'Picasso', 'Da Vinci', 'Michelangelo'], correct: 2 },
          { q: 'What is the largest planet in our solar system?', a: ['Earth', 'Saturn', 'Jupiter', 'Mars'], correct: 2 },
          { q: 'In which year did World War II end?', a: ['1943', '1945', '1950', '1939'], correct: 1 },
          { q: 'What is the chemical symbol for gold?', a: ['Go', 'Gd', 'Au', 'Ag'], correct: 2 },
          { q: 'Which country hosted the 2016 Summer Olympics?', a: ['China', 'Brazil', 'UK', 'Japan'], correct: 1 },
        ],
        Hard: [
          { q: 'What is the approximate speed of light?', a: ['150,000 km/s', '300,000 km/s', '500,000 km/s', '1,000,000 km/s'], correct: 1 },
          { q: 'Who discovered penicillin?', a: ['Einstein', 'Newton', 'Fleming', 'Curie'], correct: 2 },
          { q: 'What is the smallest country in the world?', a: ['Monaco', 'Vatican City', 'Liechtenstein', 'San Marino'], correct: 1 },
          { q: 'In which year was the first iPhone released?', a: ['2005', '2007', '2009', '2010'], correct: 1 },
          { q: 'What is the capital of Australia?', a: ['Sydney', 'Melbourne', 'Canberra', 'Perth'], correct: 2 },
        ]
      };

      const qs = questions[difficulty] || questions.Medium;
      const [qIndex, setQIndex] = useState(0);
      const [selected, setSelected] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const q = qs[qIndex % qs.length];

      const answer = (idx) => {
        if (showResult) return;
        setSelected(idx);
        setShowResult(true);
        if (idx === q.correct) setScore(s => s + 25);
        setTimeout(() => {
          setShowResult(false);
          setSelected(null);
          setQIndex(i => i + 1);
        }, 1500);
      };

      return (
        <div className="text-center w-full max-w-lg">
          <div className="text-2xl mb-8 font-medium">{q.q}</div>
          <div className="space-y-3">
            {q.a.map((opt, i) => {
              let btnClass = "w-full py-4 rounded-xl text-lg transition ";
              if (!showResult) {
                btnClass += "bg-white/20 hover:bg-white/30";
              } else {
                if (i === q.correct) btnClass += "bg-green-500";
                else if (i === selected) btnClass += "bg-red-500";
                else btnClass += "bg-white/10 opacity-60";
              }
              return (
                <button key={i} onClick={() => answer(i)} disabled={showResult} className={btnClass}>
                  {opt}
                </button>
              );
            })}
          </div>
          {showResult && (
            <div className="mt-4 text-lg font-semibold">
              {selected === q.correct ? '✅ Correct!' : '❌ Incorrect'}
            </div>
          )}
        </div>
      );
    }

    function PuzzleGame({ difficulty, setScore }) {
      const size = difficulty === 'Easy' ? 3 : difficulty === 'Medium' ? 3 : 4;
      const [tiles, setTiles] = useState([]);
      const empty = size * size - 1;

      useEffect(() => {
        const arr = Array.from({length: size*size}, (_, i) => i);
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        setTiles(arr);
      }, [difficulty]);

      const move = (index) => {
        const emptyIndex = tiles.indexOf(empty);
        const row = Math.floor(index / size);
        const col = index % size;
        const eRow = Math.floor(emptyIndex / size);
        const eCol = emptyIndex % size;
        if ((Math.abs(row - eRow) + Math.abs(col - eCol)) === 1) {
          const newTiles = [...tiles];
          [newTiles[index], newTiles[emptyIndex]] = [newTiles[emptyIndex], newTiles[index]];
          setTiles(newTiles);
          if (newTiles.every((t, i) => t === i)) {
            setScore(s => s + 100);
          }
        }
      };

      return (
        <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${size}, 70px)` }}>
          {tiles.map((tile, i) => (
            <div key={i} onClick={() => move(i)} className={`w-[70px] h-[70px] rounded-lg flex items-center justify-center text-2xl font-bold cursor-pointer ${tile === empty ? 'bg-transparent' : 'bg-pink-500 hover:bg-pink-400'}`}>
              {tile === empty ? '' : tile + 1}
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.log("SW failed:", err));
  });
}
</script>
